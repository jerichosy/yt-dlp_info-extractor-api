name: Publish API image
on:
  push:
    branches: [master]
  workflow_dispatch:
  workflow_run:
    workflows: [Dependency CI, Safe Dependabot auto-merge]
    types: [completed]
permissions:
  contents: read
  packages: write
env:
  IMAGE: ghcr.io/jerichosy/yt-dlp_info-extractor-api
jobs:
  source:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      sha: ${{ steps.resolve.outputs.sha }}
      publish: ${{ steps.resolve.outputs.publish }}
    steps:
      - id: resolve
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import json, os, subprocess, time, re
          event=json.load(open(os.environ['GITHUB_EVENT_PATH']))
          sha=os.environ['GITHUB_SHA'] if os.environ['GITHUB_REF']=='refs/heads/master' else ''
          if os.environ['GITHUB_EVENT_NAME']=='workflow_run':
              sha=''
              run=event['workflow_run']
              if run['conclusion']=='success' and run['event'] in ['pull_request','pull_request_target']:
                  prs=run.get('pull_requests',[])
                  if not prs:
                      prs=json.loads(subprocess.check_output(['gh','api','repos/'+os.environ['GITHUB_REPOSITORY']+'/commits/'+run['head_sha']+'/pulls'],text=True))
                  for attempt in range(12):
                      pending=False
                      for item in prs:
                          pr=json.loads(subprocess.check_output(['gh','api','repos/'+os.environ['GITHUB_REPOSITORY']+'/pulls/'+str(item['number'])],text=True))
                          if pr['user']['login']=='dependabot[bot]' and pr['base']['ref']=='master':
                              if pr['merged']:
                                  sha=pr['merge_commit_sha']; break
                              pending |= pr['state']=='open'
                      if sha or not pending: break
                      time.sleep(5)
          assert not sha or re.fullmatch('[0-9a-f]{40}',sha)
          with open(os.environ['GITHUB_OUTPUT'],'a') as out:
              out.write('sha='+sha+'\npublish='+str(bool(sha)).lower()+'\n')
          PY
  publish:
    needs: source
    if: needs.source.outputs.publish == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false
          ref: ${{ needs.source.outputs.sha }}
      - uses: actions/setup-python@v6
        with:
          python-version-file: .python-version
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78
      - run: uv sync --locked --all-extras --dev
      - run: uv pip check
      - run: uv run pytest -q tests/test_api_offline.py
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push tested commit
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8
        with:
          context: .
          push: true
          tags: ${{ env.IMAGE }}:sha-${{ needs.source.outputs.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/jerichosy/yt-dlp_info-extractor-api
            org.opencontainers.image.revision=${{ needs.source.outputs.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Promote current master to latest
        env:
          GH_TOKEN: ${{ github.token }}
          COMMIT_SHA: ${{ needs.source.outputs.sha }}
        run: |
          current=$(gh api "repos/$GITHUB_REPOSITORY/commits/master" --jq .sha)
          if [ "$current" = "$COMMIT_SHA" ]; then
            docker buildx imagetools create --tag "$IMAGE:latest" "$IMAGE:sha-$COMMIT_SHA"
          else
            echo 'A newer master push exists; leaving latest promotion to its build.'
          fi
